name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target di deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      restart_service:
        description: 'Riavviare auditos.service dopo deploy'
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    outputs:
      artifact: frontend-dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync backend (webapp/)
        run: |
          rsync -avz --delete \
            --exclude='__pycache__' \
            --exclude='.env' \
            --exclude='config/users.json' \
            --exclude='config/sessions.json' \
            --exclude='data/*.db*' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            webapp/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/auditos/webapp/

      - name: Rsync execution/
        run: |
          rsync -avz --delete \
            --exclude='__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            execution/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/auditos/execution/

      - name: Rsync frontend dist
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            frontend/dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/auditos/frontend/

      - name: Restart auditos.service
        if: ${{ inputs.restart_service }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo systemctl restart auditos.service && sudo systemctl status auditos.service --no-pager"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
